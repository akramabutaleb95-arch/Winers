name: Run Trading Bot
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * *' # الكود سيعمل تلقائياً كل 15 دقيقة لفحص السوق وإرسال الإشارات

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: pip install requests
    - name: Run Bot
      run: python bot.py
